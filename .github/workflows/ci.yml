name: build

# Every branch push gets a Canary build. Tag pushes are skipped: the release
# itself is built by build-msix, so building the tag here only duplicated the
# master run.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: build-windows
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Same publish command as build-msix's portable zip (minus RTB_RELEASE), so
    # a green run here means the release build compiles too.
    - name: Build portable RoundedTB
      shell: pwsh
      run: dotnet publish RoundedTB\RoundedTB.csproj -c Release -o "RoundedTB\bin\RoundedTB-$(git rev-parse --short HEAD)"

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: rtb-artifacts-${{ github.run_id }}
        path: |
          .\RoundedTB\bin\RoundedTB-*\
